name: Deploy GitHub Pages

on:
    # Deploy on a release tag (pushed by release-publish.yml) or a manual run —
    # never on ordinary pushes to main.
    #
    # NOTE: a tag run's ref is refs/tags/v*, so the github-pages environment's
    # deployment protection must allow the `v*` tag pattern (Settings →
    # Environments → github-pages → Deployment branches and tags), otherwise the
    # deploy is rejected like any other non-main ref.
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            ref:
                description: Branch, tag, or SHA to deploy
                required: false
                default: main

jobs:
    # Hotfix releases also push v* tags; only a tag reachable from main is the
    # current release, so the live site is never replaced with an older line.
    check:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            deploy: ${{ steps.check.outputs.deploy }}
        steps:
            - uses: actions/checkout@v6
              if: github.event_name == 'push'
              with:
                  fetch-depth: 0

            - id: check
              run: |
                  if [ "$GITHUB_EVENT_NAME" != push ] ||
                    git merge-base --is-ancestor HEAD origin/main; then
                    echo "deploy=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "Skipping ${GITHUB_REF_NAME}: not on main (a hotfix release)."
                    echo "deploy=false" >> "$GITHUB_OUTPUT"
                  fi

    deploy:
        needs: check
        if: needs.check.outputs.deploy == 'true'
        # Job-level, so a skipped hotfix tag run doesn't cancel a main deploy.
        concurrency:
            group: pages
            cancel-in-progress: true
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
            pages: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v6
              with:
                  # Tag push → the release tag; manual run → the chosen ref.
                  ref: ${{ inputs.ref || github.ref }}

            - uses: actions/setup-node@v6
              with:
                  node-version-file: .tool-versions
                  cache: npm

            - run: npm ci

            # build:pages runs typedoc (API docs) then build:release. typedoc is
            # kept out of build:release so the release/CI build stays fast.
            - run: npm run build:pages -w @amazon/vinyl-website

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: packages/vinyl-website/dist

            - id: deployment
              name: Deploy to GitHub Pages
              uses: actions/deploy-pages@v4
