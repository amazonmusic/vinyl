# Publishes to npm on every push to main or a hotfix/** branch:
#
# - `publish`: a release commit (`chore(release): X`, from merging a release/v*
#   PR opened by version.yml) is tagged, given a GitHub release, and published
#   under `latest` (main) or `hotfix-<name>` (hotfix/<name>).
# - `next`: any other push to main is published as a prerelease of the next
#   patch (X.Y.Z+1-next.<UTC timestamp>) under `next`. The version is applied in
#   CI only: nothing is committed or tagged.
#
# Runs on push rather than pull_request so github.ref is the real branch: that
# lets the npm-publish environment restrict publishing to main and hotfix/**,
# and npm's trusted publisher can require that environment. npm matches the
# trusted publisher by this workflow's filename, so main and hotfix releases
# must both publish from this file.
#
# GitHub Pages is NOT deployed here. Pushing the v* tag below triggers
# pages-deploy.yml, which deploys only tags reachable from main — hotfix tags
# never replace the live site.
name: Release Publish

on:
    push:
        branches: [main, 'hotfix/**']

jobs:
    publish:
        # A squash or rebase merge of the release PR keeps its
        # "chore(release): X" message on the pushed commit.
        if:
            "${{ startsWith(github.event.head_commit.message, 'chore(release):
            ') }}"
        # Per job, not per workflow: GitHub keeps one pending run per group, so
        # sharing a group with `next` would let a later push cancel a queued
        # release.
        concurrency:
            group: release-publish-${{ github.ref }}
            cancel-in-progress: false
        runs-on: ubuntu-latest
        environment: npm-publish
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  token: ${{ secrets.RELEASE_PUSH_TOKEN }}

            - uses: actions/setup-node@v6
              with:
                  node-version-file: .tool-versions
                  package-manager-cache: false
                  registry-url: https://registry.npmjs.org

            - run: npm install -g npm@latest

            - run: npm ci

            - name: Resolve release channel
              id: channel
              run: |
                  VERSION=$(node -p "require('./lerna.json').version")
                  if git rev-parse -q --verify "refs/tags/v${VERSION}" > /dev/null; then
                    echo "::error::v${VERSION} is already tagged; bump the version before releasing."
                    exit 1
                  fi
                  if [ "$GITHUB_REF_NAME" = main ]; then
                    DIST_TAG=latest
                    LATEST=true
                  else
                    # hotfix/1.2 → hotfix-1.2. Never `latest`: a hotfix line is
                    # older than the current release.
                    NAME="${GITHUB_REF_NAME#hotfix/}"
                    DIST_TAG="hotfix-${NAME//\//-}"
                    LATEST=false
                  fi
                  {
                    echo "version=${VERSION}"
                    echo "dist-tag=${DIST_TAG}"
                    echo "latest=${LATEST}"
                  } >> "$GITHUB_OUTPUT"
                  echo "Releasing v${VERSION} from ${GITHUB_REF_NAME} under dist-tag ${DIST_TAG}"

            - run: npm run release

            # Older release lines' `release` script does not build; on main this
            # is a cache hit.
            - run: npm run build:release

            - name: Tag
              env:
                  VERSION: ${{ steps.channel.outputs.version }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag -a "v${VERSION}" -m "v${VERSION}"
                  git push origin "v${VERSION}"

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ steps.channel.outputs.version }}
                  LATEST: ${{ steps.channel.outputs.latest }}
              run:
                  gh release create "v${VERSION}" --generate-notes --verify-tag
                  --latest="${LATEST}"

            - name: Strip dev-only exports before publish
              # Strips the development export condition (which points at ./src,
              # not shipped in published tarballs). This dirties the tree.
              run: npm run prepare:publish

            - name: Publish to npm
              # `npm publish --workspaces` (not `lerna publish`) because the
              # strip above leaves the tree dirty and lerna aborts on that
              # (EUNCOMMIT). npm publish has no clean-tree check; private
              # workspaces are skipped automatically. Use the full --workspaces
              # flag: the `-ws` shorthand is a hard error in current npm.
              env:
                  DIST_TAG: ${{ steps.channel.outputs.dist-tag }}
              run: npm publish --workspaces --tag "$DIST_TAG"

    next:
        if:
            "${{ github.ref == 'refs/heads/main' &&
            !startsWith(github.event.head_commit.message, 'chore(release): ') }}"
        # A newer push supersedes an older prerelease still in flight.
        concurrency:
            group: next-publish
            cancel-in-progress: true
        runs-on: ubuntu-latest
        environment: npm-publish
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v6
              with:
                  # lerna version reads tags to find the packages to version.
                  fetch-depth: 0

            - uses: actions/setup-node@v6
              with:
                  node-version-file: .tool-versions
                  package-manager-cache: false
                  registry-url: https://registry.npmjs.org

            - run: npm install -g npm@latest

            - run: npm ci

            - name: Resolve prerelease version
              id: channel
              run: |
                  RELEASED=$(node -p "require('./lerna.json').version")
                  case "$RELEASED" in
                    *-*)
                      echo "::error::lerna.json holds a prerelease (${RELEASED}); prerelease versions are never committed."
                      exit 1
                      ;;
                  esac
                  # 3.2.2 → 3.2.3-next.20260930151203: above the current release,
                  # below the next one, and ordered by build time.
                  NEXT_PATCH=$(node -p "const [a, b, c] = process.argv[1].split('.').map(Number); [a, b, c + 1].join('.')" "$RELEASED")
                  VERSION="${NEXT_PATCH}-next.$(date -u +%Y%m%d%H%M%S)"
                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                  echo "Publishing ${VERSION} from ${GITHUB_SHA} under dist-tag next"

            - run: npm run release

            - run: npm run build:release

            - name: Apply prerelease version
              # Sets every package to the prerelease and pins internal
              # dependencies to it exactly, so a `next` install never mixes
              # builds. Discarded with the runner: nothing is committed.
              env:
                  VERSION: ${{ steps.channel.outputs.version }}
              run:
                  npx lerna version "$VERSION" --exact --force-publish --yes
                  --no-git-tag-version --no-push

            - name: Strip dev-only exports before publish
              run: npm run prepare:publish

            - name: Publish to npm
              # Always `next`, never `latest`; npm also refuses to publish a
              # prerelease without an explicit --tag.
              run: npm publish --workspaces --tag next
