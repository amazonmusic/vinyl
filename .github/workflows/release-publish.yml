# Tags and publishes when a release/v* PR merges. GitHub Pages is NOT deployed
# here: this workflow runs in the pull_request context (github.ref =
# refs/pull/N/merge), which the github-pages environment rejects. Pushing the
# v* tag below triggers pages-deploy.yml, which deploys Pages from that tag.
name: Release Publish

on:
    pull_request:
        types: [closed]
        branches: [main]

concurrency:
    group: release-publish
    cancel-in-progress: false

jobs:
    publish:
        if:
            github.event.pull_request.merged == true &&
            startsWith(github.event.pull_request.head.ref, 'release/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  ref: main
                  token: ${{ secrets.RELEASE_PUSH_TOKEN }}

            - uses: actions/setup-node@v6
              with:
                  node-version-file: .tool-versions
                  package-manager-cache: false
                  registry-url: https://registry.npmjs.org

            - run: npm install -g npm@latest

            - run: npm ci

            - run: npm run release

            - name: Tag
              run: |
                  VERSION=$(node -p "require('./lerna.json').version")
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag -a "v${VERSION}" -m "v${VERSION}"
                  git push origin "v${VERSION}"

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run:
                  gh release create "v$(node -p
                  "require('./lerna.json').version")" --generate-notes

            - name: Strip dev-only exports before publish
              # Strips the development export condition (which points at ./src,
              # not shipped in published tarballs). This dirties the tree.
              run: npm run prepare:publish

            - name: Publish to npm
              # `npm publish -ws` (not `lerna publish`) because the strip above
              # leaves the tree dirty and lerna aborts on that (EUNCOMMIT).
              # npm publish has no clean-tree check; vinyl-website (private) is
              # skipped automatically.
              run: npm publish -ws
