name: Integ DRM

# Runs the integ suite on merge to main or on demand, in the installed Chrome
# and Edge on GitHub's Windows runner and in Chrome on its macOS runner. Unlike
# Playwright's builds and BrowserStack's Firefox, these browsers have their
# real Widevine CDM, so --strictDrm fails Widevine specs instead of marking
# them pending.
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: integ-drm-${{ github.ref }}
    cancel-in-progress: true

jobs:
    windows:
        runs-on: windows-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version-file: .tool-versions
                  cache: npm

            - run: npm ci

            - name: Run integ tests
              run:
                  npm run test:integ -w @amazon/vinyl --
                  --browsers=chrome,msedge --strictDrm=true

            # GitHub's artifact service sometimes answers with an HTML error
            # page; a failed upload shouldn't fail the tests.
            - name: Upload integ logs
              if: always()
              continue-on-error: true
              uses: actions/upload-artifact@v4
              with:
                  name: integ-logs-windows
                  path: packages/vinyl/integLogs/
                  if-no-files-found: ignore

    macos:
        runs-on: macos-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version-file: .tool-versions
                  cache: npm

            - run: npm ci

            - name: Run integ tests
              run:
                  npm run test:integ -w @amazon/vinyl -- --browsers=chrome
                  --strictDrm=true

            - name: Upload integ logs
              if: always()
              continue-on-error: true
              uses: actions/upload-artifact@v4
              with:
                  name: integ-logs-macos
                  path: packages/vinyl/integLogs/
                  if-no-files-found: ignore
