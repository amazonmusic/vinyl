# Opens a release PR. Run it from the branch to release ("Use workflow from"):
# main for a normal release, or a hotfix/** branch for a patch on an older line.
# Merging the PR triggers release-publish.yml.
name: Version

on:
    workflow_dispatch:

concurrency:
    group: version-${{ github.ref }}
    cancel-in-progress: false

jobs:
    version:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  token: ${{ secrets.RELEASE_PUSH_TOKEN }}

            - uses: actions/setup-node@v6
              with:
                  node-version-file: .tool-versions
                  cache: npm

            - run: npm ci

            - name: Configure git identity
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Generate version and changelogs
              run: |
                  case "$GITHUB_REF_NAME" in
                    # Bump from the conventional commits since the last release.
                    main) BUMP='' ;;
                    # A hotfix line only ever takes patches.
                    hotfix/*) BUMP='patch' ;;
                    *)
                      echo "::error::Run this workflow from main or a hotfix/** branch, not ${GITHUB_REF_NAME}."
                      exit 1
                      ;;
                  esac
                  npx lerna version $BUMP --conventional-commits --yes \
                    --no-git-tag-version --no-push

            - name: Format
              run: npx prettier . --write

            - name: Commit and open PR
              env:
                  GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
              run: |
                  VERSION=$(node -p "require('./lerna.json').version")
                  BRANCH="release/v${VERSION}"
                  git checkout -b "$BRANCH"
                  git add -A
                  git commit -m "chore(release): ${VERSION}"
                  git push origin "$BRANCH"
                  gh pr create \
                    --base "$GITHUB_REF_NAME" \
                    --head "$BRANCH" \
                    --title "chore(release): ${VERSION}" \
                    --body "Automated release PR. Merging into \`${GITHUB_REF_NAME}\` will tag v${VERSION} and publish to npm. Squash or rebase merge so the pushed commit keeps the \`chore(release):\` message."
